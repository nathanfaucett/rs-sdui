[workspace]
members = ["crates/*", "packages/browser-example/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = []
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nathanfaucett/rs-a2ui"

[workspace.dependencies]
a2ui-app = { path = "crates/a2ui-app" }
a2ui-author = { path = "crates/a2ui-author" }
a2ui-basic = { path = "crates/a2ui-basic" }
a2ui-codegen = { path = "crates/a2ui-codegen" }
a2ui-derive = { path = "crates/a2ui-derive" }
a2ui-function = { path = "crates/a2ui-function" }
a2ui-view = { path = "crates/a2ui-view" }
a2ui-wasm = { path = "crates/a2ui-wasm" }
futures = { version = "0.3", default-features = false, features = ["executor"] }
futures-timer = "3"
js-sys = "0.3"
jsonschema = { version = "=0.63.1", default-features = false }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
unicode-ident = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
deprecated = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
absolute_paths = "warn"
redundant_clone = "warn"
literal_string_with_formatting_args = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
