<!doctype html>
<html
    lang="en"
    class="a2ui-dark bg-slate-950 [--a2ui-color-background:var(--color-slate-950)]! [--a2ui-color-on-background:var(--color-slate-100)]! [--a2ui-color-surface:var(--color-slate-800)]! [--a2ui-color-on-surface:var(--color-slate-100)]! [--a2ui-color-primary:var(--color-indigo-600)]! [--a2ui-color-primary-hover:var(--color-indigo-500)]! [--a2ui-color-on-primary:var(--color-white)]! [--a2ui-color-secondary:var(--color-slate-700)]! [--a2ui-color-secondary-hover:var(--color-slate-600)]! [--a2ui-color-on-secondary:var(--color-slate-100)]! [--a2ui-color-border:var(--color-slate-700)]! [--a2ui-color-input:var(--color-slate-900)]! [--a2ui-color-on-input:var(--color-slate-100)]! [--a2ui-text-caption-color:var(--color-slate-400)]! [--a2ui-border-radius:var(--radius-xl)]! [--a2ui-button-border-radius:var(--radius-lg)]! [--a2ui-card-box-shadow:var(--shadow-lg)]!"
>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#020617" />
        <title>A2UI Shared Todo Application</title>
    </head>
    <body
        class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased selection:bg-indigo-500/30"
    >
        <div
            class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-6 sm:px-6 sm:py-8 lg:px-8"
        >
            <header
                class="flex flex-col gap-6 pb-8 sm:flex-row sm:items-end sm:justify-between"
            >
                <div class="max-w-2xl">
                    <div
                        class="mb-3 flex items-center gap-2 text-xs font-semibold tracking-[0.2em] text-indigo-400 uppercase"
                    >
                        <span
                            class="size-2 rounded-full bg-indigo-400"
                            aria-hidden="true"
                        ></span>
                        Rust + A2UI
                    </div>
                    <h1
                        class="text-3xl font-semibold tracking-tight text-white sm:text-4xl"
                    >
                        One state. Two renderers.
                    </h1>
                    <p
                        class="mt-3 text-sm leading-6 text-slate-400 sm:text-base"
                    >
                        A single Rust application drives two isolated A2UI
                        clients over one ordered message stream.
                    </p>
                </div>
                <div
                    class="inline-flex w-fit items-center gap-2 rounded-full border border-slate-800 bg-slate-900/80 px-3 py-1.5 text-xs font-medium text-slate-300"
                >
                    <span
                        class="size-1.5 rounded-full bg-emerald-400"
                        aria-hidden="true"
                    ></span>
                    SharedWorker connected
                </div>
            </header>

            <main
                class="grid flex-1 grid-cols-1 content-start gap-5 lg:grid-cols-2"
            >
                <section
                    class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70 shadow-xl shadow-slate-950/20"
                    aria-labelledby="renderer-a-title"
                >
                    <div
                        class="flex items-center justify-between border-b border-slate-800 px-5 py-4"
                    >
                        <div>
                            <h2
                                id="renderer-a-title"
                                class="text-sm font-semibold text-white"
                            >
                                Renderer A
                            </h2>
                            <p class="mt-0.5 text-xs text-slate-500">
                                Official Lit client
                            </p>
                        </div>
                        <button
                            id="connectivity-renderer-a"
                            type="button"
                            class="inline-flex min-h-9 items-center justify-center rounded-lg border border-slate-700 bg-slate-800/70 px-3 text-xs font-medium text-slate-300 transition-colors hover:bg-slate-700 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 active:bg-slate-600"
                        >
                            Go offline
                        </button>
                    </div>
                    <div id="renderer-a" class="p-5 sm:p-6"></div>
                </section>

                <section
                    class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/70 shadow-xl shadow-slate-950/20"
                    aria-labelledby="renderer-b-title"
                >
                    <div
                        class="flex items-center justify-between border-b border-slate-800 px-5 py-4"
                    >
                        <div>
                            <h2
                                id="renderer-b-title"
                                class="text-sm font-semibold text-white"
                            >
                                Renderer B
                            </h2>
                            <p class="mt-0.5 text-xs text-slate-500">
                                Official Lit client
                            </p>
                        </div>
                        <button
                            id="connectivity-renderer-b"
                            type="button"
                            class="inline-flex min-h-9 items-center justify-center rounded-lg border border-slate-700 bg-slate-800/70 px-3 text-xs font-medium text-slate-300 transition-colors hover:bg-slate-700 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 active:bg-slate-600"
                        >
                            Go offline
                        </button>
                    </div>
                    <div id="renderer-b" class="p-5 sm:p-6"></div>
                </section>
            </main>

            <footer class="pt-6 text-center text-xs text-slate-600">
                Standard A2UI messages · shared Rust state · generic transport
            </footer>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
