<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A2UI Shared Todo Application</title>
    </head>
    <body>
        <header class="app-header">
            <h1>Shared A2UI todo application</h1>
            <p>Two official renderers connected to one Rust application.</p>
        </header>
        <main class="renderers">
            <section class="renderer-pane" aria-labelledby="renderer-a-title">
                <div class="renderer-heading">
                    <h2 id="renderer-a-title">Renderer A</h2>
                    <button id="reconnect-renderer-a" type="button">
                        Reconnect
                    </button>
                </div>
                <div id="renderer-a"></div>
            </section>
            <section class="renderer-pane" aria-labelledby="renderer-b-title">
                <div class="renderer-heading">
                    <h2 id="renderer-b-title">Renderer B</h2>
                    <button id="reconnect-renderer-b" type="button">
                        Reconnect
                    </button>
                </div>
                <div id="renderer-b"></div>
            </section>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
